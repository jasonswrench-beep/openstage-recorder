[package]
name = "openstage-recorder-core"
version = "0.1.0"
description = "The parts of OpenStage Recorder's shell that need no window: the recordings folder, finding and talking to the recording program, and the checks on key combinations"
edition = "2021"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Only on Windows: Windows' own HTTPS code (WinHTTP), for Check for updates. Microsoft's own Rust bindings, MIT OR Apache-2.0; the same crate
# the window already carries through Tauri, so no new library comes in.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Networking_WinHttp"] }
