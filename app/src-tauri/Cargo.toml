[package]
name = "openstage-recorder"
version = "0.1.0"
description = "OpenStage Recorder: a light screen recorder with a simple editor"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "openstage_recorder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.7.1"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
openstage-recorder-core = { path = "../core" }
