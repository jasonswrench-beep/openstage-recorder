# Builds the OpenStage Recorder installer on a clean Windows machine from what is in this repository, as a check that it builds.
#
# Run it by hand from the Actions tab ("Run workflow"), or it runs when a version tag such as v0.1.0-alpha.4 is pushed.
# It only builds. It never makes a release or a draft, and it has no permission to: a release is built and signed on the owner's computer
# with app/tools/build_installer.py --sign, which also checks the signatures, and published by hand (docs/recorder/RELEASING.md). So this
# workflow can never publish an unsigned installer.
#
# Two downloads are kept with the run, for checking (both UNSIGNED):
#   OpenStage-Recorder-installer-unsigned  the setup file and its .sha256.txt
#   OpenStage-Recorder-portable-unsigned   a folder with "OpenStage Recorder.exe" and the recording program, to unzip and double-click
#
# The build is the same script as a release's (app/tools/build_installer.py, without --sign): the folders of the machine are not written into
# the programs, both programs are checked for the user folder's name, and the installer must carry the web view's setup instead of
# downloading it. The actions are pinned to the commit of a release, not to a tag that can move.

name: Build the Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Get the files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Fetch the libraries
        shell: pwsh
        run: |
          cargo fetch --locked --manifest-path capture/Cargo.toml
          cargo fetch --locked --manifest-path app/src-tauri/Cargo.toml
          Set-Location app
          npm ci --no-audit --no-fund

      - name: Check the app
        working-directory: app
        run: |
          npm run typecheck
          npm test

      - name: Build and check the installer
        shell: pwsh
        run: python -I app/tools/build_installer.py

      - name: Keep the installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: OpenStage-Recorder-installer-unsigned
          path: app/dist/release/*
          if-no-files-found: error

      - name: Make the portable folder
        working-directory: app
        shell: pwsh
        run: |
          $out = "portable/OpenStage Recorder"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "src-tauri/target/release/openstage-recorder.exe" "$out/OpenStage Recorder.exe"
          Copy-Item "../capture/target/release/openstage-capture.exe" "$out/openstage-capture.exe"
          Copy-Item "../LICENSE" "$out/LICENSE.txt"
          Copy-Item "../NOTICE" "$out/NOTICE.txt"
          Copy-Item "../capture/THIRD-PARTY.md" "$out/THIRD-PARTY.md"
          Copy-Item "portable-readme.txt" "$out/READ ME FIRST.txt"
          Get-ChildItem $out | Format-Table Name, Length

      - name: Keep the portable folder
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: OpenStage-Recorder-portable-unsigned
          path: app/portable
          if-no-files-found: error
